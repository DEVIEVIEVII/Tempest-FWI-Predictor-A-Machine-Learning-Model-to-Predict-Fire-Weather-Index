<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>FWI Prediction</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body
{
font-family:'Poppins',sans-serif;
height:100vh; margin:0; 
display:flex; 
justify-content:center;
align-items:center;
background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)), url("/static/background2.jpg"); background-size:cover;
background-position:center;
background-repeat:no-repeat;
}

.container{ margin-top:40px; }
 
.card{ 
border:none;
border-radius:20px; 
background:rgba(255,255,255,0.92); 
backdrop-filter: blur(10px);
box-shadow:0 20px 40px rgba(0,0,0,0.3);
padding:30px; } 

h2{ font-weight:600; 
color:#333; } 


.form-control{ 
border-radius:10px; 
padding:12px; 
transition:0.3s; 
border:1px solid #ddd; 
} 
.form-control:focus
{ 
border-color:#667eea; 
box-shadow:0 0 8px rgba(102,126,234,0.4); 
}
 
label
{ 
font-weight:500; 
color:#444; 
}

.btn-primary
{ 
background:linear-gradient(45deg,#ff512f,#dd2476); 
border:none; 
border-radius:30px; 
padding:12px 35px; 
font-size:18px; 
transition:0.3s; 
} 
.btn-primary:hover
{ transform:scale(1.05); 
background:linear-gradient(45deg,#dd2476,#ff512f); 
} 
</style>

</head>

<body>

<div class="container">

<div class="card shadow-lg p-5">

<h2 class="text-center text-dark mb-4">
🔥 Fire Weather Index Prediction
</h2>

<form action="/predict" method="post">

    <div class="row">

<div class="col-md-6">
<label>Month</label>
<input type="number" name="month" class="form-control" placeholder="Enter Month (1-12)" required>
</div>

<div class="col-md-6">
<label>Day</label>
<input type="number" name="day" class="form-control" placeholder="Enter Day (1-31)" required>
</div>

</div>

<br>


<div class="row">

<div class="col-md-6 mb-3">
<label>Temperature</label>
<input type="number" step="any" name="Temperature" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label>Relative Humidity</label>
<input type="number" step="any" name="RH" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label>Wind Speed</label>
<input type="number" step="any" name="Ws" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label>Rain</label>
<input type="number" step="any" name="Rain" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label>FFMC</label>
<input type="number" step="any" name="FFMC" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label>DMC</label>
<input type="number" step="any" name="DMC" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label>ISI</label>
<input type="number" step="any" name="ISI" class="form-control" required>
</div>

<div class="row">

<div class="col-md-6">
<label>area</label>
<select name="area" class="form-control" required>
<option value="">Select Region</option>
<option value="0">Bejaia</option>
<option value="1">Sidi Bel-Abbes</option>
</select>
</div>

</div>

<div class="text-center mt-4">
<button type="submit" class="btn btn-primary btn-lg">
Predict FWI
</button>
</div>

</form>

</div>

</div>

</body>
</html>
