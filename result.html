<!DOCTYPE html>
<html>
<head>
    <title>Result</title>

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #36d1dc, #5b86e5);
            text-align: center;
            color: white;
            animation: fadeIn 1.5s ease-in;
        }

        .box {
            background: white;
            color: black;
            padding: 20px;
            width: 300px;
            margin: auto;
            margin-top: 100px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
            transition: transform 0.3s ease;
        }

        .box:hover {
            transform: translateY(-5px);
        }

        .risk {
            font-size: 20px;
            font-weight: bold;
        }

        a {
            text-decoration: none;
            color: blue;
        }

        /* Risk Colors */
        .low { color: green; }
        .moderate { color: orange; }
        .high { color: red; }
        .veryhigh { color: darkred; }

        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>

<body>

    <div class="box">
        <h2><i class="fas fa-chart-line"></i> Prediction Result</h2>

        <p><b>FWI Value:</b> {{ prediction }}</p>

        <p class="risk">
            <b>Fire Risk:</b> 
            <span class="
                {% if risk == 'Low' %}low
                {% elif risk == 'Moderate' %}moderate
                {% elif risk == 'High' %}high
                {% else %}veryhigh
                {% endif %}
            ">
                {{ risk }}
            </span>
        </p>

        <br>
        <a href="/">🔙 Try Again</a>
    </div>

</body>
</html>
