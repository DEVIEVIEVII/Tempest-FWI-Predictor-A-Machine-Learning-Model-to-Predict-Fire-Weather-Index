<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;

background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
url("/static/background1.jpg");

background-size:cover;
background-position:center;
background-repeat:no-repeat;
}



.login-box{
background:rgba(255,255,255,0.9);
padding:40px;
width:360px;
border-radius:15px;
text-align:center;
box-shadow:0 15px 35px rgba(0,0,0,0.3);
backdrop-filter: blur(5px);
}

.login-box h2{
margin-bottom:25px;
color:#333;
}



.login-box input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:14px;
transition:0.3s;
}

.login-box input:focus{
border-color:#667eea;
outline:none;
box-shadow:0 0 8px rgba(102,126,234,0.6);
}



.login-box button{
width:100%;
padding:12px;
margin-top:15px;
background:linear-gradient(45deg,#667eea,#764ba2);
border:none;
color:white;
font-size:16px;
border-radius:8px;
cursor:pointer;
transition:0.3s;
}

.login-box button:hover{
transform:scale(1.05);
}



.footer{
margin-top:15px;
font-size:13px;
color:#555;
}



</style>

</head>

<body>

<div class="login-box">

<h2>🔐 Login</h2>

<form method="POST">

<input type="text" name="username" placeholder="Enter Username" required>

<input type="password" name="password" placeholder="Enter Password" required>

<button type="submit">Login</button>

</form>

<div class="footer">
<p>Welcome to Fire Weather Prediction System</p>
</div>

</div>

</body>
</html>
