<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Forest Fire Weather Index predictor">
  <title>{% block title %}FWI Predictor{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="page-shell">
    <div class="page-glow page-glow-left"></div>
    <div class="page-glow page-glow-right"></div>
    <main class="app-card">
      <header class="app-header">
        <div>
          <p class="eyebrow">Forest Fire Weather Index</p>
          <h1 class="brand-title">FWI Predictor</h1>
        </div>
        <div class="badge">Model-driven input form</div>
      </header>

      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
