<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire Weather Index Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                        'slide-up': 'slideUp 0.6s ease-out',
                        'bounce-gentle': 'bounceGentle 2s infinite',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(30px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        bounceGentle: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .glass-effect {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .input-focus {
            transition: all 0.3s ease;
        }
        .input-focus:focus {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
        }
        .btn-hover {
            transition: all 0.3s ease;
        }
        .btn-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-2xl">
        <!-- Header -->
        <div class="text-center mb-8 animate-fade-in">
            <div class="inline-block p-4 rounded-full bg-white/10 backdrop-blur-sm mb-4 animate-bounce-gentle">
                <svg class="w-16 h-16 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.879 16.121A3 3 0 1012.015 11L11 14H9c0 .768.293 1.536.879 2.121z"></path>
                </svg>
            </div>
            <h1 class="text-5xl font-bold text-white mb-2 animate-slide-up">Fire Weather Index</h1>
            <p class="text-xl text-white/80 animate-slide-up" style="animation-delay: 0.2s">Advanced Forest Fire Prediction System</p>
        </div>

        <!-- Form Card -->
        <div class="glass-effect rounded-2xl p-8 shadow-2xl animate-slide-up" style="animation-delay: 0.4s">
            <h2 class="text-2xl font-semibold text-white mb-6 text-center">Enter Weather Parameters</h2>

            <form action="/predict" method="post" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Temperature -->
                    <div class="group">
                        <label class="block text-white font-medium mb-2 transition-colors group-hover:text-yellow-300">Temperature (°C)</label>
                        <input type="number" step="0.1" name="Temperature" required
                               class="input-focus w-full px-4 py-3 bg-white/20 border border-white/30 rounded-lg text-white placeholder-white/60 focus:outline-none focus:border-white/60"
                               placeholder="e.g., 25.5">
                    </div>

                    <!-- Relative Humidity -->
                    <div class="group">
                        <label class="block text-white font-medium mb-2 transition-colors group-hover:text-yellow-300">Relative Humidity (%)</label>
                        <input type="number" step="0.1" name="RH" required
                               class="input-focus w-full px-4 py-3 bg-white/20 border border-white/30 rounded-lg text-white placeholder-white/60 focus:outline-none focus:border-white/60"
                               placeholder="e.g., 65.2">
                    </div>

                    <!-- Wind Speed -->
                    <div class="group">
                        <label class="block text-white font-medium mb-2 transition-colors group-hover:text-yellow-300">Wind Speed (km/h)</label>
                        <input type="number" step="0.1" name="Ws" required
                               class="input-focus w-full px-4 py-3 bg-white/20 border border-white/30 rounded-lg text-white placeholder-white/60 focus:outline-none focus:border-white/60"
                               placeholder="e.g., 12.5">
                    </div>

                    <!-- Rain -->
                    <div class="group">
                        <label class="block text-white font-medium mb-2 transition-colors group-hover:text-yellow-300">Rain (mm)</label>
                        <input type="number" step="0.1" name="Rain" required
                               class="input-focus w-full px-4 py-3 bg-white/20 border border-white/30 rounded-lg text-white placeholder-white/60 focus:outline-none focus:border-white/60"
                               placeholder="e.g., 0.2">
                    </div>

                    <!-- FFMC -->
                    <div class="group">
                        <label class="block text-white font-medium mb-2 transition-colors group-hover:text-yellow-300">Fine Fuel Moisture Code</label>
                        <input type="number" step="0.1" name="FFMC" required
                               class="input-focus w-full px-4 py-3 bg-white/20 border border-white/30 rounded-lg text-white placeholder-white/60 focus:outline-none focus:border-white/60"
                               placeholder="e.g., 85.2">
                    </div>

                    <!-- DMC -->
                    <div class="group">
                        <label class="block text-white font-medium mb-2 transition-colors group-hover:text-yellow-300">Duff Moisture Code</label>
                        <input type="number" step="0.1" name="DMC" required
                               class="input-focus w-full px-4 py-3 bg-white/20 border border-white/30 rounded-lg text-white placeholder-white/60 focus:outline-none focus:border-white/60"
                               placeholder="e.g., 26.7">
                    </div>

                    <!-- ISI -->
                    <div class="group md:col-span-2">
                        <label class="block text-white font-medium mb-2 transition-colors group-hover:text-yellow-300">Initial Spread Index</label>
                        <input type="number" step="0.1" name="ISI" required
                               class="input-focus w-full px-4 py-3 bg-white/20 border border-white/30 rounded-lg text-white placeholder-white/60 focus:outline-none focus:border-white/60"
                               placeholder="e.g., 5.8">
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="text-center pt-4">
                    <button type="submit"
                            class="btn-hover bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 text-white font-bold py-4 px-8 rounded-lg text-lg shadow-lg transform transition-all duration-300">
                        <span class="flex items-center justify-center">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                            </svg>
                            Predict Fire Weather Index
                        </span>
                    </button>
                </div>
            </form>

            <!-- Info Section -->
            <div class="mt-8 p-4 bg-white/10 rounded-lg">
                <div class="flex items-center text-white/80 text-sm">
                    <svg class="w-4 h-4 mr-2 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
                    </svg>
                    Enter accurate weather parameters for the most reliable fire risk prediction.
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-8 text-white/60 text-sm animate-fade-in" style="animation-delay: 1s">
            <p>Advanced AI-Powered Forest Fire Prediction System [Springboard]</p>
        </div>
    </div>

    <!-- Background Animation -->
    <div class="fixed inset-0 pointer-events-none">
        <div class="absolute top-1/4 left-1/4 w-2 h-2 bg-white/20 rounded-full animate-pulse-slow"></div>
        <div class="absolute top-3/4 right-1/4 w-1 h-1 bg-white/30 rounded-full animate-pulse-slow" style="animation-delay: 1s"></div>
        <div class="absolute top-1/2 left-1/2 w-3 h-3 bg-white/10 rounded-full animate-pulse-slow" style="animation-delay: 2s"></div>
    </div>
</body>
</html>
